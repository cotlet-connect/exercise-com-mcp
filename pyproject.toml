[project]
name = "exercise-com-mcp"
version = "1.1.0"
description = "Connect Exercise.com to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Exercise.com API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["exercise.com", "exercise.com api", "exercise.com mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/exercise-com-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=exercise-com"
Source = "https://github.com/cotlet-connect/exercise-com-mcp"

[project.scripts]
exercise-com-mcp = "exercise_com_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"exercise_com_agent.py" = "exercise_com_agent.py"

[tool.hatch.build.targets.sdist]
include = ["exercise_com_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
